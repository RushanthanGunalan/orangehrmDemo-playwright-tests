name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    # Bumped from 30: the shared public demo has sessions where a single
    # element takes close to the 60s wait (see ARCHITECTURE.md §6), and CI
    # retries a failed test twice - a bad-spell run (11 tests x up to 3
    # attempts x several 60s waits) no longer fits in 45 minutes.
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This repo uses pnpm (see package.json's "packageManager" field) -
      # corepack (bundled with Node 18+) reads that field and installs the
      # exact pinned pnpm version, so CI always matches what's used locally
      # instead of drifting to whatever pnpm happens to be latest.
      - name: Enable corepack (for pnpm)
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright tests
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      # Zips the HTML report so notify-discord.mjs can attach it directly to
      # the Discord message - a one-click download in the channel, no
      # GitHub login required, on top of the upload-artifact copy above.
      # Trace files (data/*.zip) are excluded - they aren't viewable in a
      # browser anyway (they need `npx playwright show-trace`), so they're
      # pure size cost with no payoff for a Discord attachment.
      # continue-on-error stands in for an "only if the report dir exists"
      # guard, in case the test step never got far enough to produce one.
      - name: Zip HTML report for Discord
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: montudor/action-zip@v1
        with:
          args: zip -qq -r playwright-report.zip playwright-report -x "playwright-report/data/*.zip"
      - name: Notify Discord
        if: ${{ always() }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ vars.DISCORD_THREAD_ID }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REPORT_ZIP_PATH: playwright-report.zip
        run: node scripts/notify-discord.mjs
